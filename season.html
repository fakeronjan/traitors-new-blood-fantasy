<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Traitors - Fantasy League</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script src="js/theme-boot.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1 class="site-title">The Traitors</h1>
    <p class="site-subtitle">Family Fantasy League</p>
    <div class="season-tabs header-season-tabs" id="league-season-tabs"></div>
    <nav class="main-nav">
      <a href="index.html">Leaderboard</a>
      <a href="draft.html">Draft</a>
      <a href="cast.html">Cast</a>
      <a href="rules.html">Rules</a>
      <a href="log.html">Episode Log</a>
      <a href="season.html" class="active">Past Seasons</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="season-tabs" id="season-tabs"></div>
  <h2 id="season-title">Season</h2>
  <p class="site-subtitle" id="season-summary"></p>
  <div class="table-scroll">
  <table class="history-table" id="season-table">
    <thead><tr id="season-table-head"></tr></thead>
    <tbody></tbody>
  </table>
  </div>
</div>

<footer class="site-footer"></footer>

<script type="module">
import { computePlayerTotals, roleLabel } from './js/scoring.js';
import { loadLeague, applySeasonChrome, fateSummary } from './js/season.js';

const { league, season: viewing } = await loadLeague();
applySeasonChrome(league, viewing);

const round1 = n => Math.round(n * 10) / 10;

const params = new URLSearchParams(location.search);
let view = params.get('s') === null ? 'all' : params.get('s');

// Seasons 1-4 are backtests of the real US seasons; after that, every finished family
// league season before the one being viewed (Season 5 shows New Blood, and so on).
// key = the ?s= value, label = tab/title, short = the Season column, order = sort.
const backtests = (await fetch('data/history/seasons.json').then(r => r.json()))
  .map(s => ({ ...s, key: String(s.season), label: `Season ${s.season}`, short: String(s.season),
               order: s.season, dir: `data/history/season-${s.season}` }));
const leaguePast = league.seasons
  .filter(s => s.id < viewing.id && s.champion)
  .sort((a, b) => a.id - b.id)
  .map(s => ({ key: s.slug, label: s.label, short: s.label, order: s.id,
               note: s.past_seasons_note, dir: `data/seasons/${s.id}`, league: true }));
const seasons = [...backtests, ...leaguePast];
if (view !== 'all' && !seasons.some(s => s.key === view)) view = 'all';

const seasonParam = viewing.id === league.current ? '' : `season=${viewing.slug}`;
const pageHref = s => {
  const q = [seasonParam, s === null ? '' : `s=${s}`].filter(Boolean).join('&');
  return q ? `season.html?${q}` : 'season.html';
};

document.getElementById('season-tabs').innerHTML = [
  `<a href="${pageHref(null)}" class="${view === 'all' ? 'active' : ''}">All Seasons</a>`,
  ...seasons.map(s => `<a href="${pageHref(s.key)}" class="${s.key === view ? 'active' : ''}">${s.label}</a>`),
].join('');

async function loadSeason(meta) {
  const [players, events] = await Promise.all([
    fetch(`${meta.dir}/players.json`).then(r => r.json()),
    fetch(`${meta.dir}/events.json`).then(r => r.json()),
  ]);
  // League seasons don't store fate_summary; derive it the same way the backtests word it.
  players.forEach(p => { p.fate_summary ??= fateSummary(p.id, events); });
  if (!meta.winners) {
    meta.winners = players.filter(p => events.some(e => e.player === p.id && e.type === 'winner')).map(p => p.name);
  }
  return { players, events };
}

const tableHead = document.getElementById('season-table-head');
const tbody = document.querySelector('#season-table tbody');

if (view === 'all') {
  document.getElementById('season-title').textContent = 'All Seasons';
  const NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
  const scope = [`the first ${NUM[backtests.length] ?? backtests.length} US seasons`, ...leaguePast.map(s => s.label)];
  const scopeText = scope.length > 2 ? `${scope.slice(0, -1).join(', ')}, and ${scope.at(-1)}` : scope.join(' and ');
  document.getElementById('season-summary').textContent = `Every contestant from ${scopeText}, scored with this exact ruleset and ranked together.`;
  tableHead.innerHTML = '<th>#</th><th>Name</th><th class="col-season">Season</th><th class="col-wide">Role</th><th class="col-wide">Fate</th><th>Score</th>';

  const seasonData = await Promise.all(seasons.map(loadSeason));
  const combined = [];
  seasons.forEach((s, i) => {
    const { players, events } = seasonData[i];
    const totals = computePlayerTotals(players, events);
    players.forEach(p => {
      combined.push({
        order: s.order,
        short: s.short,
        label: s.label,
        name: p.name,
        fate: p.fate_summary,
        score: totals[p.id] ?? 0,
        role: roleLabel(p.id, events),
        isWinner: events.some(e => e.player === p.id && e.type === 'winner'),
      });
    });
  });
  combined.sort((a, b) => b.score - a.score || b.order - a.order);

  tbody.innerHTML = combined.map((r, i) => {
    const roleCls = r.role === 'Traitor' ? 'traitor' : (r.role === 'Recruited Traitor' ? 'recruited' : '');
    return `<tr class="${r.isWinner ? 'winner-row' : ''}">
      <td class="rank">${i + 1}</td>
      <td class="pname">${r.name}<span class="row-sub"><span class="role-badge ${roleCls}">${r.role}</span><span>${r.label} &middot; ${r.fate}</span></span></td>
      <td class="col-season">${r.short}</td>
      <td class="col-wide"><span class="role-badge ${roleCls}">${r.role}</span></td>
      <td class="col-wide">${r.fate}</td>
      <td class="score">${round1(r.score)}</td>
    </tr>`;
  }).join('');
} else {
  const meta = seasons.find(s => s.key === view);
  const { players, events } = await loadSeason(meta);  // also fills meta.winners for league seasons

  document.getElementById('season-title').textContent = meta.label;
  document.getElementById('season-summary').textContent = `Winner: ${meta.winners.join(' & ')} - ${meta.note}`;
  tableHead.innerHTML = '<th>#</th><th>Name</th><th class="col-wide">Role</th><th class="col-wide">Fate</th><th>Score</th>';

  const totals = computePlayerTotals(players, events);
  const ranked = [...players].sort((a, b) => (totals[b.id] ?? 0) - (totals[a.id] ?? 0));

  tbody.innerHTML = ranked.map((p, i) => {
    const role = roleLabel(p.id, events);
    const roleCls = role === 'Traitor' ? 'traitor' : (role === 'Recruited Traitor' ? 'recruited' : '');
    const isWinner = events.some(e => e.player === p.id && e.type === 'winner');
    return `<tr class="${isWinner ? 'winner-row' : ''}">
      <td class="rank">${i + 1}</td>
      <td class="pname">${p.name}<span class="row-sub"><span class="role-badge ${roleCls}">${role}</span><span>${p.fate_summary}</span></span></td>
      <td class="col-wide"><span class="role-badge ${roleCls}">${role}</span></td>
      <td class="col-wide">${p.fate_summary}</td>
      <td class="score">${round1(totals[p.id] ?? 0)}</td>
    </tr>`;
  }).join('');
}
</script>
<script src="js/iframe-resize.js"></script>
</body>
</html>
