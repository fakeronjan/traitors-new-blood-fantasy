<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Traitors - Fantasy League</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1 class="site-title">The Traitors</h1>
    <p class="site-subtitle">Family Fantasy League</p>
    <div class="season-tabs header-season-tabs" id="league-season-tabs"></div>
    <nav class="main-nav">
      <a href="index.html">Leaderboard</a>
      <a href="draft.html">Draft</a>
      <a href="cast.html" class="active">Cast</a>
      <a href="rules.html">Rules</a>
      <a href="log.html">Episode Log</a>
      <a href="season.html">Past Seasons</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <h2 id="cast-title">The Cast</h2>
  <p class="photo-credit" id="photo-credit"></p>
  <div id="cast-grid" class="cast-grid"></div>
</div>

<footer class="site-footer"></footer>

<script type="module">
import { ownerName } from './js/scoring.js';
import { loadLeague, applySeasonChrome, champBadge, metaLines } from './js/season.js';

const { league, season } = await loadLeague();
applySeasonChrome(league, season);
document.getElementById('photo-credit').textContent = season.photo_credit;

const players = await fetch(`data/seasons/${season.id}/players.json`).then(r => r.json()).then(list =>
  [...list].sort((a, b) => a.name.localeCompare(b.name))
);

document.getElementById('cast-title').textContent = `The ${players.length}`;

document.getElementById('cast-grid').innerHTML = players.map(p => `
  <div class="cast-card">
    <div class="photo-wrap"><img src="${p.photo}" alt="${p.name}" loading="lazy"></div>
    <div class="cast-info">
      <p class="cast-name">${p.name}</p>
      ${metaLines(p).map(m => `<p class="cast-meta">${m}</p>`).join('')}
      ${p.owner ? `<p class="cast-meta">Drafted by ${ownerName(p.owner)}${champBadge(p.owner, season)}</p>` : ''}
    </div>
  </div>
`).join('');
</script>
<script src="js/iframe-resize.js"></script>
</body>
</html>
