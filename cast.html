<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Traitors: New Blood - Fantasy League</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1 class="site-title">The Traitors: New Blood</h1>
    <p class="site-subtitle">Family Fantasy League</p>
    <nav class="main-nav">
      <a href="index.html">Leaderboard</a>
      <a href="draft.html">Draft</a>
      <a href="cast.html" class="active">Cast</a>
      <a href="rules.html">Rules</a>
      <a href="log.html">Episode Log</a>
      <a href="season.html">Past Seasons</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <h2>The 22</h2>
  <p class="photo-credit">Photos and hometowns via NBC's official cast reveal.</p>
  <div id="cast-grid" class="cast-grid"></div>
</div>

<footer class="site-footer">Season premieres Sept 17, 2026 on NBC/Peacock. Cast photos courtesy of NBC.</footer>

<script type="module">
import { ownerName } from './js/scoring.js';

const players = await fetch('data/players.json').then(r => r.json()).then(list =>
  [...list].sort((a, b) => a.name.localeCompare(b.name))
);

document.getElementById('cast-grid').innerHTML = players.map(p => `
  <div class="cast-card">
    <div class="photo-wrap"><img src="${p.photo}" alt="${p.name}" loading="lazy"></div>
    <div class="cast-info">
      <p class="cast-name">${p.name}</p>
      <p class="cast-meta">${p.age} &middot; ${p.profession}</p>
      <p class="cast-meta">${p.hometown}</p>
      ${p.owner ? `<p class="cast-meta">Drafted by ${ownerName(p.owner)}</p>` : ''}
    </div>
  </div>
`).join('');
</script>
</body>
</html>
